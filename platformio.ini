; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; BLE + WiFi + web server will not fit the 1.25 MB default app slot.
board_build.partitions = min_spiffs.csv
check_src_filters = +<src/*> +<include/*>
lib_deps =
  esp32async/AsyncTCP
  esp32async/ESPAsyncWebServer
  bblanchon/ArduinoJson@^7
  tzapu/WiFiManager

[env:native]
platform = native
test_framework = unity
; Only the Arduino-free logic module compiles on the host.
build_src_filter = +<tilt_encoding.cpp>
build_flags = -std=gnu++17 -I include
