; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
; This project lives under OneDrive, which dehydrates freshly-extracted package
; files. SCons then reads a null mtime and the build dies with
; "unsupported operand type(s) for -: 'float' and 'NoneType'". It bites the
; Unity package that `pio test` installs, so keep dependencies out of the
; synced tree.
libdeps_dir = ${sysenv.LOCALAPPDATA}/PlatformIO/libdeps/iBeacon-Simulator

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; BLE + WiFi + web server will not fit the 1.25 MB default app slot.
board_build.partitions = min_spiffs.csv
; Error-level only. Without this CORE_DEBUG_LEVEL is 0 and every log_e() inside
; AsyncTCP and ESPAsyncWebServer is compiled out, so the networking stack fails
; silently -- which is exactly what made a wedged web server so hard to read.
; Level 1 keeps the flash cost to the error paths.
build_flags = -DCORE_DEBUG_LEVEL=1
check_src_filters = +<src/*> +<include/*> +<lib/*>
; cppcheck follows #includes into the dependencies even though they are outside
; check_src_filters. It cannot expand ArduinoJson's variadic macros and reports
; a high-severity preprocessorErrorDirective for it, which is a cppcheck
; limitation rather than a defect. Judge project code only.
check_flags =
  cppcheck: --suppress=*:*libdeps*
lib_deps =
  esp32async/AsyncTCP
  esp32async/ESPAsyncWebServer
  bblanchon/ArduinoJson@^7
  tzapu/WiFiManager
; Unit tests run on the target: there is no host compiler on this machine, and
; tilt_encoding lives in lib/ so the tests link it without dragging in main.cpp
; (and its setup/loop) alongside the test runner's own.
test_framework = unity
test_port = COM7
test_speed = 115200
