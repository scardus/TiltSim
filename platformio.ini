; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; BLE + WiFi + web server will not fit the 1.25 MB default app slot.
board_build.partitions = min_spiffs.csv
; Error-level only. Without this CORE_DEBUG_LEVEL is 0 and every log_e() inside
; AsyncTCP and ESPAsyncWebServer is compiled out, so the networking stack fails
; silently -- which is exactly what made a wedged web server so hard to read.
; Level 1 keeps the flash cost to the error paths.
build_flags =
  -DCORE_DEBUG_LEVEL=1
  ; AsyncTCP defaults this to 8192*2. That stack is carved out of the heap at
  ; startup and held for the life of the device, and heap -- specifically the
  ; largest contiguous block -- is the binding constraint here, not RAM in total.
  ;
  ; Measured with uxTaskGetStackHighWaterMark(), reported by /api/state as
  ; tcpStackFree so it can be re-checked rather than taken on trust: the deepest
  ; the async task ever went was 2824 bytes, across serving both pages, the JSON
  ; API, a tilt patch, an aborted upload and a complete 1.7 MB OTA including
  ; Update.end()'s MD5 verify. /api/state is the deepest path, not OTA.
  ;
  ; 8192 leaves 5368 bytes spare, about 2.9x the worst case seen. If that is ever
  ; wrong it fails loudly rather than quietly: the framework builds with
  ; CONFIG_FREERTOS_CHECK_STACKOVERFLOW_CANARY and WATCHPOINT_END_OF_STACK, so an
  ; overflow is a panic with a backtrace, not silent corruption.
  -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
  ; NimBLE compiles from source, so it is configured by build flag rather than
  ; by sdkconfig. This is a pure beacon -- it advertises and does nothing else --
  ; so three of the four BLE roles are dead weight. The fourth, BROADCASTER, is
  ; on by default and is the one being used.
  ;
  ; These are the names nimconfig.h reads. The library's own docs give a
  ; MYNEWT_VAL_BLE_ROLE_* spelling; on the ESP port those are *derived* from
  ; these, so setting them silently loses to esp_nimble_cfg.h and the roles stay
  ; compiled in. It announces itself as a "redefined" warning on every
  ; translation unit, which is the only sign that the flag did nothing.
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=0     ; no GATT client
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=0    ; never scans
  -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0  ; no GATT server
  ; Deliberately not setting the two log levels. Both defaults are already what
  ; this project wants: the host stack defaults to 5 (NONE), and the C++ wrapper
  ; follows CORE_DEBUG_LEVEL above, so it is already at ERROR. Turning the host
  ; log on costs ~32 KB of flash, so the obvious-looking "match CORE_DEBUG_LEVEL"
  ; flag would make the image bigger, not smaller.
check_src_filters = +<src/*> +<include/*> +<lib/*>
; cppcheck follows #includes into the dependencies even though they are outside
; check_src_filters. It cannot expand ArduinoJson's variadic macros and reports
; a high-severity preprocessorErrorDirective for it, which is a cppcheck
; limitation rather than a defect. Judge project code only.
check_flags =
  cppcheck: --suppress=*:*libdeps*
lib_deps =
  esp32async/AsyncTCP
  esp32async/ESPAsyncWebServer
  bblanchon/ArduinoJson@^7
  tzapu/WiFiManager
  ; Replaces the Bluedroid-based "ESP32 BLE Arduino" bundled with the core. The
  ; Arduino core's sdkconfig has CONFIG_BT_NIMBLE_ENABLED unset, so there is no
  ; IDF-side NimBLE to collide with: this library carries the whole host stack
  ; in its own sources and only the shared BT controller is reused.
  h2zero/NimBLE-Arduino@^2.5.0
; The pure logic lives in lib/ so the tests link it without dragging in main.cpp
; (and its setup/loop) alongside the test runner's own. That split is also what
; lets the same suites run on a desktop compiler -- see [env:native] below.
test_framework = unity
test_port = COM7
test_speed = 115200

; The same test suites, built by the host compiler instead of the cross one.
;
; Everything under test is Arduino-free, so this needs no hardware, runs in
; about a second rather than two minutes, and is what CI uses -- the runner has
; no board to flash. The on-target run above stays the authority for anything
; whose answer can depend on the target: notably the AppConfig layout, which is
; what actually sits in NVS.
;
; Locally this needs a host g++ on PATH (MinGW-w64); without one, use
; `pio test -e esp32dev` and let CI cover this environment.
[env:native]
platform = native
test_framework = unity
; ispindel_encoding builds its payload with ArduinoJson, which compiles happily
; on a desktop compiler. The LDF cannot infer it here because no src/ file is
; scanned in this environment.
lib_deps = bblanchon/ArduinoJson@^7
; There is nothing here to build outside of tests: src/ is Arduino code and
; would not survive a host compiler. This makes a stray `pio run -e native` a
; no-op rather than a wall of errors.
build_src_filter = -<*>
